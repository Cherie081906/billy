<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хөдөө гаръя л даа 🥺</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --accent: #ff7a00;
      --accent-dark: #df5f00;
      --text: #24323c;
      --shadow: 0 18px 50px rgba(28, 73, 91, 0.22);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 16% 14%,
          rgba(255, 255, 255, 0.92) 0 5%,
          transparent 6%
        ),
        radial-gradient(
          circle at 82% 18%,
          rgba(255, 255, 255, 0.8) 0 7%,
          transparent 8%
        ),
        linear-gradient(
          to bottom,
          #7fdcff 0%,
          #c8f1ff 48%,
          #f7efc6 49%,
          #9bdd7c 72%,
          #4eaa59 100%
        );
    }

    body {
      display: grid;
      place-items: center;
      position: relative;
      padding: 18px;
    }

    .sun {
      position: fixed;
      top: 7vh;
      right: 8vw;
      z-index: 0;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #ffd84d;
      box-shadow:
        0 0 0 14px rgba(255, 216, 77, 0.17),
        0 0 36px rgba(255, 198, 0, 0.35);
    }

    .hill {
      position: fixed;
      bottom: -18vh;
      z-index: 0;
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }

    .hill-one {
      left: -15vw;
      width: 75vw;
      height: 42vh;
      background: rgba(52, 154, 77, 0.34);
      transform: rotate(7deg);
    }

    .hill-two {
      right: -20vw;
      width: 80vw;
      height: 37vh;
      background: rgba(31, 127, 60, 0.28);
      transform: rotate(-8deg);
    }

    .floating {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .floating-item {
      position: absolute;
      bottom: -50px;
      opacity: 0.35;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      to {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(94vw, 460px);
      min-height: min(720px, 90vh);
      max-height: 92vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 22px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .progress {
      position: absolute;
      top: 17px;
      right: 22px;
      left: 22px;
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 122, 0, 0.16);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd23f, #ff7a00);
      transition: width 0.35s ease;
    }

    .counter {
      margin: 8px 0 12px;
      color: rgba(36, 50, 60, 0.58);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .gif-wrap {
      display: grid;
      width: min(330px, 78vw);
      aspect-ratio: 1 / 1;
      place-items: center;
      overflow: hidden;
      margin-bottom: 18px;
      border-radius: 24px;
      background: #eaf8ff;
      box-shadow: 0 10px 25px rgba(25, 74, 94, 0.16);
    }

    #gif {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      max-width: 380px;
      margin: 0 0 22px;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.15;
      animation: pop 0.35s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.88);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .button-zone {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 130px;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        opacity 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      position: relative;
      z-index: 5;
      color: white;
      background: linear-gradient(135deg, #ff9b28, #ff6a00);
      box-shadow: 0 9px 20px rgba(255, 106, 0, 0.32);
    }

    #noBtn {
      position: relative;
      z-index: 4;
      color: #29434f;
      background: #dff3ff;
      box-shadow: 0 7px 16px rgba(28, 80, 100, 0.14);
    }

    .final-title {
      margin-top: 8px;
      color: var(--accent-dark);
      font-size: clamp(28px, 7vw, 42px);
      animation: final-pop 0.7s cubic-bezier(0.2, 0.9, 0.25, 1.25);
    }

    @keyframes final-pop {
      from {
        opacity: 0;
        transform: scale(0.65) rotate(-3deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    .confetti {
      position: fixed;
      top: -25px;
      z-index: 20;
      width: 11px;
      height: 16px;
      pointer-events: none;
      animation: fall 3.2s linear forwards;
    }

    @keyframes fall {
      to {
        opacity: 0.9;
        transform: translate3d(var(--drift), 110vh, 0) rotate(760deg);
      }
    }

    @media (max-height: 710px) {
      .card {
        min-height: 94vh;
        padding-top: 30px;
      }

      .gif-wrap {
        width: min(245px, 58vw);
      }

      h1 {
        margin-bottom: 10px;
        font-size: 24px;
      }

      .button-zone {
        min-height: 102px;
      }
    }
  </style>
</head>

<body>
  <div class="sun"></div>
  <div class="hill hill-one"></div>
  <div class="hill hill-two"></div>
  <div class="floating" id="floating"></div>

  <main class="card">
    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="counter" id="counter">1 / 10</div>

    <div class="gif-wrap">
      <img id="gif" alt="GIF" />
    </div>

    <h1 id="question"></h1>

    <div class="button-zone" id="buttonZone">
      <button id="yesBtn">Тийм ээ 💖</button>
      <button id="noBtn">Үгүй</button>
    </div>
  </main>

  <script>
    const steps = [
      {
        text: "Хөдөө гаръя 🥺",
        gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWt6dWcwcjc4cWIyeW03MnBuajI1NTBmbXhtc2Q4M21zaTJobGdzciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/MCXqa6SugyCZZl7piR/giphy.gif"
      },
      {
        text: "Агаар салхинд гаръя л даа 🌿",
        gif: "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWJhdHVtYTVuYTN4Z2N3bzZlcGhiNXp6dHZrdzJ6eGw4eDEycDhiZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/P8R7H7IpfWR4C5M7p3/giphy.gif"
      },
      {
        text: "Сайхан тоглож наадаад явъя л даа 😭",
        gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExano0OW1iMWt4Z25kZ292YWZkNjBkZTNmajZkMmVhbGNhcXlydGI0aiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/VbKLOdvCxBFNZpYvhL/giphy.gif"
      },
      {
        text: "Гоё шүү дээ, тийм ээ? 🥹",
        gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExano0OW1iMWt4Z25kZ292YWZkNjBkZTNmajZkMmVhbGNhcXlydGI0aiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3KC2jD2QcBOSc/giphy.gif"
      },
      {
        text: "Мах энэ тэр шараад гоё биш үү? 🍖",
        gif: "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3NnlkbnFjenR3d3poNTVjcW1zN3N4aHViaXVzZGE0YmFleWtjc3U2diZlcD12MV9naWZzX3JlbGF0ZWQmY3Q9Zw/K0dTI5x9i9fkHBCuQW/giphy.gif"
      },
      {
        text: "Сайхан Монголд байгаа юм шиг гаръя л даа 🇲🇳",
        gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbGhzZ2RsdHVsYmN0aDdrNXkyMXhsNHF2cnFudTdsajBva3Ric3VwMiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/T0RQmjegkDhKhPpHVs/giphy.gif"
      },
      {
        text: "Төсөөлөөд үз дээ 💭",
        gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXh2MTd0ZGx0YzUzcWNiM3Nid3p2eWptbGpkbnYyaTE0dHAzMzBnZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/QFsPtlrcMlS8w/giphy.gif"
      },
      {
        text: "Цаанаасаа л бие чинь хүсэж байгаа 😏",
        gif: "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3OXVkY21ocGd1OGVoZDFsb2Vsa2JpMzl3MGtlaG1kcmM1OXVibXphbCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8aaYpes0ZWsyiKMWsJ/giphy.gif"
      },
      {
        text: "Зун цаг дууслаа шүү дээ ☀️",
        gif: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExczM2ODNuNjNjeXp3bW83cmkxYzBwZ3lmbW8zdGg0bXVydGJ6Z21rYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3orieWsOgnin1Mh5wk/giphy.gif"
      },
      {
        text: "Гуйж байна аа 😭👉👈",
        gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExejI1dmRsYWp5eTBucXJ0a3FsODJ2djBwMTlhbnFld3V4aDN4eGh0cyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/9uwnYUDw342pq/giphy.gif"
      }
    ];

    const finalGif =
      "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3dGo2M3p1azY0bjZhbHFjZW9mdDBmeXBzaGV0M3B4NGlldncxYjJ2cCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/jbUspndg5yz8UfVs8R/giphy.gif";

    let current = 0;
    let yesScale = 1;
    let noScale = 1;

    const gif = document.getElementById("gif");
    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const zone = document.getElementById("buttonZone");
    const counter = document.getElementById("counter");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");

    const allGifs = [...steps.map(step => step.gif), finalGif];

    allGifs.forEach(url => {
      const image = new Image();
      image.decoding = "async";
      image.src = url;
    });

    function renderStep() {
      const step = steps[current];

      gif.src = step.gif;
      question.textContent = step.text;

      question.style.animation = "none";
      void question.offsetWidth;
      question.style.animation = "pop 0.35s ease";

      counter.textContent = `${current + 1} / ${steps.length}`;

      progressBar.style.width =
        `${((current + 1) / steps.length) * 100}%`;

      yesScale = Math.min(1 + current * 0.11, 1.95);
      noScale = current === steps.length - 1 ? 0.75 : 1;

      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform = `scale(${noScale})`;

      noBtn.style.position = "relative";
      noBtn.style.left = "auto";
      noBtn.style.top = "auto";
    }

    function showFinal() {
      progress.style.display = "none";
      counter.style.display = "none";
      zone.style.display = "none";

      gif.src = finalGif;

      question.textContent =
        "Тийм ээ, чи зөв сонголт хийлээ! 💖";

      question.className = "final-title";

      launchConfetti();
    }

    function moveNoButton() {
      const zoneRect = zone.getBoundingClientRect();
      const buttonRect = noBtn.getBoundingClientRect();

      const maxX = Math.max(
        0,
        zoneRect.width - buttonRect.width
      );

      const maxY = Math.max(
        0,
        zoneRect.height - buttonRect.height
      );

      noScale = Math.max(noScale - 0.1, 0.16);
      yesScale = Math.min(yesScale + 0.13, 2.3);

      noBtn.style.position = "absolute";
      noBtn.style.left = `${Math.random() * maxX}px`;
      noBtn.style.top = `${Math.random() * maxY}px`;
      noBtn.style.transform = `scale(${noScale})`;

      yesBtn.style.transform = `scale(${yesScale})`;
    }

    yesBtn.addEventListener("click", showFinal);

    noBtn.addEventListener("click", event => {
      event.preventDefault();

      if (current < steps.length - 1) {
        current++;
        renderStep();
      } else {
        moveNoButton();
      }
    });

    noBtn.addEventListener("mouseenter", event => {
      if (current === steps.length - 1) {
        event.preventDefault();
        moveNoButton();
      }
    });

    noBtn.addEventListener(
      "touchstart",
      event => {
        if (current === steps.length - 1) {
          event.preventDefault();
          moveNoButton();
        }
      },
      { passive: false }
    );

    document.addEventListener("pointermove", event => {
      if (
        current !== steps.length - 1 ||
        zone.style.display === "none"
      ) {
        return;
      }

      const rect = noBtn.getBoundingClientRect();

      const distance = Math.hypot(
        event.clientX - (rect.left + rect.width / 2),
        event.clientY - (rect.top + rect.height / 2)
      );

      if (distance < 75) {
        moveNoButton();
      }
    });

    function createFloatingItems() {
      const container = document.getElementById("floating");

      const icons = [
        "☀️",
        "☁️",
        "🌿",
        "✨",
        "🌼",
        "🦋"
      ];

      for (let i = 0; i < 18; i++) {
        const item = document.createElement("span");

        item.className = "floating-item";

        item.textContent =
          icons[Math.floor(Math.random() * icons.length)];

        item.style.left = `${Math.random() * 100}%`;

        item.style.fontSize =
          `${16 + Math.random() * 24}px`;

        item.style.animationDuration =
          `${7 + Math.random() * 8}s`;

        item.style.animationDelay =
          `${Math.random() * 8}s`;

        container.appendChild(item);
      }
    }

    function launchConfetti() {
      const colors = [
        "#ff7a00",
        "#ffd447",
        "#57d9a3",
        "#56c7ff",
        "#8f7cff"
      ];

      for (let i = 0; i < 90; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
          `${Math.random() * 100}vw`;

        piece.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        piece.style.borderRadius =
          Math.random() > 0.5 ? "50%" : "2px";

        piece.style.animationDelay =
          `${Math.random() * 0.9}s`;

        piece.style.animationDuration =
          `${2.4 + Math.random() * 2.2}s`;

        piece.style.setProperty(
          "--drift",
          `${-130 + Math.random() * 260}px`
        );

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 5000);
      }
    }

    createFloatingItems();
    renderStep();
  </script>
</body>
</html>
